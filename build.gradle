plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.146'
}

version = mod_version
group = 'com.tacz'

base {
    archivesName = "tacz-${minecraft_version}-neoforge"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

tasks.named('wrapper', Wrapper).configure {
    gradleVersion = '8.14.3'
    distributionType = Wrapper.DistributionType.BIN
}

sourceSets.main.java.srcDir 'shared/src/main/java'
sourceSets.main.resources.srcDir 'src/generated/resources'
sourceSets.test.java.srcDir 'shared/src/test/java'

neoForge {
    version = project.neo_version

    // ModDevGradle uses Mojang mappings and detects META-INF/accesstransformer.cfg.
    runs {
        client {
            client()
            gameDirectory = project.file('run/client_a')
            jvmArguments.addAll '-Xms1G', '-Xmx4G'
        }
        client2 {
            client()
            gameDirectory = project.file('run/client_b')
            programArguments.addAll '--username', 'mayday_memory'
            jvmArguments.addAll '-Xms1G', '-Xmx4G'
        }
        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
        }
        data {
            clientData()
            gameDirectory = project.file('run/data')
            programArguments.addAll '--mod', 'tacz', '--all',
                    '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
        }
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
    mods {
        tacz {
            sourceSet sourceSets.main
        }
    }

    unitTest {
        enable()
        testedMod = mods.tacz
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me'
        content { includeGroup 'me.shedaniel.cloth' }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        name = 'JitPack'
        url = 'https://jitpack.io'
        content { includeGroup 'com.github.FiguraMC.luaj' }
    }
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    jarJar(implementation('org.apache.commons:commons-math3')) {
        version { strictly '[3.6.1,4.0)'; prefer '3.6.1' }
    }
    jarJar(implementation('com.github.FiguraMC.luaj:luaj-core')) {
        version { strictly '[3.0.8-figura]'; prefer '3.0.8-figura' }
        exclude group: 'org.apache.commons', module: 'commons-lang3'
    }
    jarJar(implementation('com.github.FiguraMC.luaj:luaj-jse')) {
        version { strictly '[3.0.8-figura]'; prefer '3.0.8-figura' }
        exclude group: 'org.apache.commons', module: 'commons-lang3'
    }
    jarJar(implementation('org.apache.bcel:bcel')) {
        version { strictly '[6.6.1,7.0)'; prefer '6.6.1' }
        exclude group: 'org.apache.commons', module: 'commons-lang3'
    }
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    implementation "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}"
    compileOnly "maven.modrinth:shoulder-surfing-reloaded:${shoulder_surfing_version}"
    compileOnly "curse.maven:player-animation-library-${player_animation_project}:${player_animation_file}"
    compileOnly files('libs/controllable-neoforge-1.21.10-0.25.4-release.jar')
    compileOnly files('libs/framework-neoforge-1.21.10-0.13.5-signed.jar')

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Mixin and MixinExtras are supplied by NeoForge; do not embed Forge variants.
    // KubeJS has no compatible 1.21.10 release. Its sources and discovery metadata
    // are preserved under optional-integrations/kubejs and are not in this artifact.
    // Forge 1.20.1 jars in libs/ cannot be used on this compile/runtime classpath.
}

tasks.named('processResources', ProcessResources).configure {
    def replacements = [
            mod_version: project.version,
            minecraft_version_range: project.minecraft_version_range,
            neo_version: project.neo_version
    ]
    inputs.properties replacements
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replacements
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes 'Implementation-Title': project.name,
                'Implementation-Version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

idea.module.downloadSources = true
